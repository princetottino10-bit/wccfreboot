<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>wccfreboot</title>
  <style>
    body { margin: 0; background: #0b0f14; color: #e8edf2; font: 16px/1.6 -apple-system, system-ui, sans-serif; padding: 24px; }
    code { color: #9fd3ff; }
  </style>
</head>
<body>
  <h1>wccfreboot</h1>
  <p>開発中（フェーズ1）。この端末の対応状況：</p>
  <ul id="caps"></ul>
  <script type="module">
    const caps = document.getElementById('caps');
    const row = (label, ok) => {
      const li = document.createElement('li');
      li.textContent = `${label}: ${ok ? '○' : '×'}`;
      caps.append(li);
    };
    row('HTTPS（安全な接続）', window.isSecureContext);
    let webgpu = false;
    if (navigator.gpu) {
      try {
        webgpu = Boolean(await navigator.gpu.requestAdapter());
      } catch {
        webgpu = false;
      }
    }
    row('WebGPU', webgpu);
    row('WebGL2', Boolean(document.createElement('canvas').getContext('webgl2')));
  </script>
</body>
</html>
